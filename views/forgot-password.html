<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi Phục Mật Khẩu — SuperCar Luxury</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/public/css/style.css">
  <link rel="stylesheet" href="/public/css/auth.css">
  <link rel="stylesheet" href="/public/css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="/" class="logo">
        <span class="logo-text">SUPERCAR<span>LUXURY</span></span>
      </a>
      <div class="nav-buttons">
        <a href="/views/login.html" class="btn-dark" style="padding: 10px 20px; font-size: 0.75rem;"><i class="fas fa-arrow-left"></i> Đăng Nhập</a>
      </div>
    </div>
  </header>

  <!-- Forgot Password Form -->
  <div class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-header">
        <h2>Quên Mật Khẩu</h2>
        <p>Nhập email đăng ký tài khoản của bạn để khôi phục mật khẩu</p>
      </div>
      <form id="forgot-form">
        <div class="form-group">
          <label for="email">Địa Chỉ Email Đăng Ký</label>
          <input type="email" id="email" class="form-control" placeholder="Nhập địa chỉ email..." required>
        </div>
        <button type="submit" class="btn-gold auth-btn">Gửi Yêu Cầu Khôi Phục</button>
      </form>
    </div>
  </div>

  <script src="/public/js/toast.js"></script>
  <script src="/public/js/main.js"></script>
  <script src="/public/js/auth.js"></script>
</body>
</html>
